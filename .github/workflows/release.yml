name: Release

# Releases this repository (the template it is copied from is templates/release.yml). Runs only in
# ESchuderer/reusable-workflows; its first release, v0.1.0, is published by hand on the 0.1.0 commit.
# release-please keeps one release pull request open; merging it tags the version and creates the GitHub Release.
# The release App opens it so its checks run; without RELEASE_APP_CLIENT_ID the owner approves those runs by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  release-please:
    if: ${{ github.repository == 'ESchuderer/reusable-workflows' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write, pull-requests: write, issues: write }
    steps:
      - id: app-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
