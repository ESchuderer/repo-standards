name: CI

# This repository runs the gates it publishes, from the same commit (`./` calls), plus the template check.
# `edited` reruns the run when a pull request title changes, so a corrected title turns `check` green without a push.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
  schedule:
    - cron: '37 5 * * 1' # Monday 05:37, CodeQL and zizmor on unchanged code
      timezone: Europe/Berlin

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gates.yml # zizmor: ignore[self-repository] actionlint checks inputs of ./ calls only
    with:
      dependency-review: false

  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository] actionlint checks inputs of ./ calls only

  # Each template calls the shared workflows by the published path. Rewritten to the local path, actionlint checks
  # the inputs a template passes against the workflows of this commit, so an interface change that breaks a template
  # fails here.
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint on the templates
        run: |
          set -eu
          for f in templates/*.yml; do
            name=$(basename "$f")
            [ "$name" = dependabot.yml ] && continue
            sed -E 's#ESchuderer/reusable-workflows/(\.github/workflows/[a-z0-9-]+\.yml)@[^ ]+#./\1#' "$f" > ".github/workflows/template-$name"
          done
          docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color .github/workflows/template-*.yml

  check:
    if: always()
    needs: [gates, templates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
