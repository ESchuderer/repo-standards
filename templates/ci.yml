name: CI

# Copy to .github/workflows/ci.yml, set <release-sha> # <version> to the latest release, set the CodeQL languages
# the repository has, add the product jobs to `needs` of `check` and name area jobs that may skip in
# `allowed-skips` (docs/ci-conventions.md). A private repository passes `dependency-review: false` to `gates` and drops
# the `codeql` job (docs/ci-conventions.md, Private repositories).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
  schedule:
    - cron: '37 5 * * 1' # Monday 05:37, CodeQL and zizmor on unchanged code
      timezone: Europe/Berlin
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gates:
    permissions: { contents: read, pull-requests: read }
    uses: ESchuderer/reusable-workflows/.github/workflows/gates.yml@<release-sha> # <version>
  codeql:
    permissions: { security-events: write, contents: read, actions: read }
    uses: ESchuderer/reusable-workflows/.github/workflows/codeql.yml@<release-sha> # <version>
    with:
      languages: '["actions", "javascript-typescript"]'
  check:
    if: always()
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
